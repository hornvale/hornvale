[package]
name = "hornvale-game"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hornvale: the game."

[lib]
name = "hornvale_game"
path = "src/lib.rs"

[[bin]]
name = "hornvale-game"
path = "src/main.rs"

[dependencies]
hornvale-game-core = { path = "../core" }
hornvale-kernel = { path = "../../../kernel" }
hornvale-worldgen = { path = "../../../windows/worldgen" }
hornvale-vessel = { path = "../../../windows/vessel" }
# `SkyPins`/`TerrainPins` are re-exported from these two domains, not from
# hornvale-worldgen (a private `use`, not `pub use`, in its lib.rs) — the
# same pair `clients/vessel/wasm/Cargo.toml` depends on directly for the
# identical reason.
hornvale-astronomy = { path = "../../../domains/astronomy" }
hornvale-terrain = { path = "../../../domains/terrain" }
# The Portolan (Task 3): `resolve_at` takes a `Phonology`/`MorphOptions` pair
# (`hornvale-worldgen`'s `language_of_in`/`morph_options` build them), so the
# driver needs the type names to hold what it resolves once at `start` — an
# in-repo path dependency, not a new external crate, so decision 0004's
# allowlist (which does not bind `clients/` anyway) is not in play.
hornvale-language = { path = "../../../domains/language" }
# The Portolan part II, Task 5 (discovery): `Driver::start` reads every
# settlement's committed `latitude`/`longitude` off the ledger once, to seed
# the world plate's point-site roster (`plate::point_site_at`) — the same
# ledger read the H4 test below used to do dev-only, now needed on the
# shipped path too, so it moved out of `[dev-dependencies]` rather than
# being declared twice.
hornvale-settlement = { path = "../../../domains/settlement" }
# The Quadrat (Task 6): band B's perception overlay is placed from each
# `scene/surrounds/v2` cell's own `room` (a packed `FacetId`), read off the
# value `Session::purview` already hands back — so `driver.rs` now needs to
# NAME `hornvale_scene::SurroundsScene` where before it only read fields off
# it. Already in the build graph as a dependency of `hornvale-vessel`; this
# is the same in-repo path-dependency-not-a-new-crate case the three
# dependencies above record.
hornvale-scene = { path = "../../../windows/scene" }
crossterm = "0.29"
# CONCERN, flagged per the task brief: a third new dependency beyond
# crossterm. Added only after review found that an external SIGINT/SIGTERM/
# SIGHUP (e.g. `kill` from another terminal, or the controlling terminal
# closing) took Rust's default disposition — terminate immediately, no
# unwind, no `Drop` — and left the terminal in raw mode on the alternate
# screen (see `term.rs`'s `watch_signals` doc and the task report's pty
# evidence). `signal-hook`'s self-pipe-backed `iterator::Signals` is the
# standard, minimal-risk way to do this without hand-rolling async-signal-
# safety; `cargo tree` already resolves it at 0.3.18 as a TRANSITIVE
# dependency of crossterm itself (crossterm's own SIGWINCH/resize handling
# uses it), so this adds no new crate to the build — only a direct `use` of
# one already being compiled.
signal-hook = "0.3"

# The vision sketch example parses a fixture snapshot; kept as a
# dev-dependency so no shipped code path gains it.
[dev-dependencies]
serde_json = "1"
