# Standalone workspace: the root Cargo.toml `exclude`s this path, like
# clients/vessel/wasm and tools/type-audit. Nothing here is bound by the
# workspace dependency allowlist (decision 0055).
#
# Task 4 scoped this to `members = ["core"]` because `bin/` did not exist yet
# (a workspace member path that does not exist is a hard `cargo metadata`/
# `build`/`test` error, not a lazily-resolved glob). Task 10 creates `bin/`,
# so `"bin"` is restored here.
[workspace]
members = ["core", "bin"]
resolver = "3"

# Profiles are per workspace root: the root's Whetstone profile does not
# reach an excluded workspace. Measured 2026-09-02 (The Hone): `Driver::start`
# 27.5 s and 300-630 ms per turn at opt-level 0, 3.8 s and 10-80 ms optimised.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.libm]
opt-level = 3
