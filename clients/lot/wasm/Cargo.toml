[package]
name = "hornvale-lot-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The Lot: one life drawn from everyone who ever lived, as a wasm cdylib for the project book."

# Standalone workspace (the root Cargo.toml `exclude`s this path, like
# clients/vessel/wasm and clients/world-wasm) so this crate can own the
# size-critical release profile below — workspace members cannot set
# per-package panic/LTO.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
hornvale-kernel = { path = "../../../kernel" }
hornvale-worldgen = { path = "../../../windows/worldgen" }
hornvale-lot = { path = "../../../windows/lot" }
hornvale-astronomy = { path = "../../../domains/astronomy" }
hornvale-terrain = { path = "../../../domains/terrain" }

[profile.release]
# Vessel's measured profile (decision 0052): ties go to the smaller binary.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Profiles are per workspace root: the root's Whetstone profile does not
# reach an excluded workspace. Measured 2026-09-02 (The Hone): `Driver::start`
# 27.5 s and 300-630 ms per turn at opt-level 0, 3.8 s and 10-80 ms optimised.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.libm]
opt-level = 3
