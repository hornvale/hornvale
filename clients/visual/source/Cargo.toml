[package]
name = "hornvale-visual-source"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Immutable native scientific observation source for independent visual clients"

[dependencies]
hornvale-kernel = { path = "../../../kernel" }
hornvale-worldgen = { path = "../../../windows/worldgen" }
hornvale-scene = { path = "../../../windows/scene" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[dev-dependencies]
hornvale-astronomy = { path = "../../../domains/astronomy" }
