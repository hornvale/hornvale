[package]
name = "hornvale-bevy-view"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_state", "bevy_winit", "x11", "3d_bevy_render", "ui_api", "ui_bevy_render", "default_font", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
