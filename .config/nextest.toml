# .config/nextest.toml — the profile surface, unused until The Timekeeper.
#
# `default` is deliberately left at nextest's own defaults: `make gate` must
# behave exactly as it did before this campaign.
#
# `slow-timeout.period` MARKS a test slow; it does not kill it.
# `terminate-after` is deliberately absent (The Timekeeper spec, N4):
# observation and enforcement are separate knobs, and conflating them means a
# contention blip destroys a run instead of reporting one.

[profile.default]

# THE THREE SCATTERED BATTERIES RUN ALONE. Since The Scatter these tests
# parallelise their own 200-seed sweeps across every core
# (`windows/lab/tests/seed_sweep/`), so nextest must stop scheduling anything
# ALONGSIDE them. `gate-full-heavy.sh` sets no `test-threads` limit, so
# without this the canonical box runs up to 40 heavy processes each wanting 40
# worker threads — where before The Scatter each held exactly ONE live world.
# `threads-required = "num-cpus"` reserves the whole runner for the battery.
#
# CHOSEN ON MEASUREMENT, AND THE FASTER SHAPE LOST. Two full heavy runs on
# lefford (40 cores), same ref, differing only in this block:
#
#            shape                          wall     cpu_ratio  failures
#   B  concurrent, 10 workers each        2432 s       18.38    2
#   A  alone, whole runner each (this)    2773 s       18.86    1
#   —  pre-Scatter, serial sweeps         6134 s        1.80    (and a
#      cancelled 14,143 s run that never finished the tier at all)
#
# B is 12% faster in TOTAL wall clock — and that 12% is inside this tier's own
# run-to-run noise: `docs/timings.md` records two nominally comparable heavy
# runs at 8187.657 s and 7388.713 s, a 10% spread. So the wall-clock axis
# barely separates them, and the failure count does.
#
# B's second failure is not real. `hornvale::scene_cost` is a WALL-CLOCK
# BUDGET test, and B's oversubscription reddened it.
#
# FIRST, A CODE REGRESSION IS IMPOSSIBLE BY CONSTRUCTION.
# `git diff --stat 7138ce75 239d24a7` is `.config/nextest.toml | 19 +++`:
# one file, nineteen lines, all of it test SCHEDULING. A and B share every
# byte of every crate. Nothing `scene_cost` exercises differs between them.
#
# SECOND, THE MOVE IS UNIFORM, WHICH IS THE SIGNATURE `scene_cost.rs` ITSELF
# NAMES. Its module doc: "a real regression is LOCAL: one or two metrics move
# and the rest hold. A uniform 3x across metrics with unrelated causes is the
# machine." Against that file's own recorded bases (its `slowest:` row,
# 2026-07-29, same box, same ~80-way load band), every one of the five
# inflated by a similar factor under B:
#
#                        run B    basis    ratio   vs budget
#   genesis            12995.4   6318.6    2.06x    99.96%  <- 4.6 ms under
#   SceneContext::build 2340.7   1308.0    1.79x     86.7%
#   tiles(512)+json    10137.5   4319.9    2.35x    116.5%  <- FAILED
#   small docs+json        6.9      2.7    2.56x    132.7%  <- would also fail
#   region per tile      378.1    206.1    1.83x     90.0%
#
# 1.79x-2.56x across all five. Only two crossed a budget because the budgets
# carry different headroom, not because those two metrics moved differently.
#
# THIRD, THE TWO METRICS THE CISTERN NEVER TOUCHED MOVED MOST. `genesis` and
# `small docs+json` are the campaign's own CONTROL — their doc comments say so
# ("Unchanged by The Cistern, deliberately"; "Untouched by The Cistern, which
# is the point"), and the module doc uses their agreement as the evidence that
# the other three fell because the code changed. Under B they read 2.06x and
# 2.56x, the largest excursion of the five among them, on code untouched since
# 2026-07-28. That is not a thing a code change can do; it is the Cistern
# example's own contention signature reproduced (it lists `small docs+json`
# at 6.8 ms tagged "untouched Sextant ceiling"; B measured 6.9).
#
# Count alone would have argued the other way — two-of-five over budget IS the
# rubric's "one or two metrics move" sentence. The discriminator is the next
# sentence, and the ratios above are it. Note also that only ONE failure is
# reported: the asserts are ORDERED and `tiles` trips before `small docs` is
# ever evaluated, so the failure message undercounts the excursion.
#
# Under A `scene_cost` passes in 10.2 s — quicker than the 13.1 s it took
# before The Scatter. A tier whose reds already need reading carefully must
# not manufacture more of them, and a duration measured under 40-way
# contention is not one anyone can budget against
# (PROC-heavy-tier-cost-budget wants exactly these numbers).
#
# Per battery, A is where the win actually is: 1007→331 s (mire), 2427→990 s
# (fare preregistered), 1099→353 s (fare exploratory). Peak RSS of the
# heaviest, measured alone at 40 workers: 22.3 GB of lefford's 377 GB, at
# 2914% CPU — against the ~82 GB the uncapped concurrent shape was projected
# to hold co-resident.
#
# In `[profile.default]` DELIBERATELY, not in `[profile.heavy]`: the cap must
# also bind a hand-typed `cargo nextest run --run-ignored only`, not just the
# wrapper — a check is worth only the configurations it runs in (The Siding).
# This changes nothing for `make gate` or `make ci`: neither passes
# `--run-ignored`, so neither has ever run these four.
[[profile.default.overrides]]
# class: scatter-sweep
# class: front-loaded
filter = 'test(/census_budget_and_spacing_hold_across_seeds$/) | test(/the_mires_preregistered_readout$/) | test(/the_fares_preregistered_readout$/) | test(/the_fares_exploratory_readout$/)'
threads-required = "num-cpus"
# `priority = 100` (The Governor, Task 1): FRONT-LOAD the barrier this class
# already pays. `threads-required = "num-cpus"` reserves the whole runner,
# but without a priority nextest schedules a reserving test wherever it
# falls in run order — mid-tier here, since `the_mires_preregistered_readout`
# sat 47th of 118. That drains every OTHER running test first (including an
# 891 s pole test), runs the reservation alone, then restarts the remaining
# 71 tests from cold. Measured on the canonical box, twice, at different
# SHAs: a 484 s and a 485 s barrier tax against a ~1068 s theoretical
# optimum, on a 1552 s tier. `priority` is `i8` (-128..=127, cargo-nextest
# 0.9.140 on both hosts), higher runs first; 100 schedules these three
# batteries before anything else, so the drain happens once, at the start.
#
# VERIFIED, NOT ARGUED: a seven-test scratch probe outside this repo
# (`/tmp/gov-probe`, four-worker pool, one `threads-required = "num-cpus"`
# test placed mid-order). No `priority`: wall 10.076 s, the reserving test
# completes 3rd. `priority = 100` on the reserving test and `priority = 50`
# on the tier's next-longest test: wall 8.041 s, the reserving test
# completes 1st. Positive control: `priority = 500` is rejected with
# `invalid type: 64-bit integer 500, expected an signed 8 bit integer`,
# proving nextest reads this file rather than ignoring an unknown key.
priority = 100

# A SECOND CLASS (The Ballast): WALL-CLOCK BUDGET TESTS PINNED AS VICTIMS,
# NOT SOURCES. The block above protects everything ELSE from three batteries
# that saturate the box; this one protects two tests FROM the tier's own
# saturation, because they measure wall clock and cannot tell contention
# from a real regression on their own.
#
# `session_cost.rs::a_possessed_turn_stays_within_its_ceilings` reddened in
# the heavy tier on the canonical box: `handle+snapshot+json` measured
# 14.324 ms against its 8 ms `TURN_BUDGET_MS` ceiling. Run ALONE on the same
# quiet canonical box (load average 0.16-0.44) it passed at 15.897 s wall
# clock. Same signature the section above already establishes — a uniform
# inflation with no code change — except this time it moved a metric the
# test's own module doc calls a CONTROL, expected to hold steady under
# contention because it runs against a `World` already resident in memory.
# It moved anyway: under ~40-way oversubscription, even CPU-light work waits
# on the scheduler, not the CPU, so "cheap" is not the same as "immune".
#
# `scene_cost.rs::scene_api_cost_is_bounded_on_seed_42` is pinned alongside
# it PRE-EMPTIVELY — it did not fail in the run that motivated this change,
# but it is the exact test the section above's own comment already names as
# this class's symptom ("the FIRST SYMPTOM is a spurious
# `hornvale::scene_cost` failure"), and its module doc is the corrected
# discriminator `session_cost.rs` explicitly reuses. Leaving the test this
# file already documents as the canary unprotected, while fixing the one
# that happened to fail first, would be inconsistent; pinning it costs
# little, since it already runs ALONE in ~10.2 s per the measurement above.
#
# A SEPARATE override block, not a merged filter: neither test calls
# `seed_sweep::map_seeds(`, so folding them into the scatter-sweep class's
# filter would blur two different reasons for the same `threads-required`
# setting. `cli/tests/heavy_tier.rs` checks each block's roster
# independently, in both directions, against its own class marker.
[[profile.default.overrides]]
# class: wall-clock-budget
# class: front-loaded
filter = 'test(/a_possessed_turn_stays_within_its_ceilings$/) | test(/scene_api_cost_is_bounded_on_seed_42$/)'
threads-required = "num-cpus"
# `priority = 100` (The Governor, Task 1) — same reason as the scatter-sweep
# table above: this class ALSO reserves the whole runner (it is pinned as a
# VICTIM of tier contention rather than a SOURCE, but `threads-required =
# "num-cpus"` still drains everything else and cold-restarts it either way),
# so it must also be scheduled first rather than wherever it happens to fall
# in run order. See the scatter-sweep table's comment for the measured
# barrier tax and the scratch-probe arms that verified `priority` moves it.
priority = 100

# A THIRD CLASS (The Governor, Task 8): A SIZED PANEL RESERVES ONLY WHAT IT
# NEEDS, NOT THE WHOLE BOX. Both tables above pin `threads-required =
# "num-cpus"` — the whole runner — because they either genuinely saturate it
# (a 200-seed scatter sweep) or cannot tell the tier's own saturation from a
# regression (a wall-clock budget). Task 9 gives several hearsay/worldgen
# tests their own `seed_sweep::map_seeds(` call too, but on small, BOUNDED
# panels (a dozen-ish seeds, not two hundred) — parallelising a sweep that
# used to run serially. The `the_serialization_pin_names_exactly_the_
# batteries_that_scatter_their_sweeps` guard in `cli/tests/suite/heavy_tier.rs`
# is a strict two-way match against every `map_seeds` caller, so the moment
# Task 9 adds one, that guard fails — and the NAIVE fix, adding each newly
# parallel test to the "num-cpus" table above, would turn it green while
# creating one full-drain-then-cold-restart barrier PER CONVERTED TEST, at
# ~484 s each (see that table's comment). This campaign's Task 1 spent its
# entire contribution removing exactly one such barrier; re-adding several
# to ship a "green guard" would make the tier dramatically worse while every
# check passed. This class exists so the guard has somewhere honest to point
# a bounded panel instead.
#
# `threads-required = <int>` (a bounded integer, not the `"num-cpus"`
# string) is supported by cargo-nextest 0.9.140 — verified directly, the same
# way `priority` was verified above: a scratch override table with
# `threads-required = 4` and `filter = 'none()'` parses under both
# `cargo nextest list` and `cargo nextest run` and changes nothing about
# which tests run.
#
# `cli/tests/suite/heavy_tier.rs` reads this table the same way it reads the
# two above — a `# class: sized-sweep` marker line, a live `threads-
# required` SETTING (checked to be an integer, not the `"num-cpus"` string —
# using that string here would silently reproduce the exact trap this class
# exists to avoid), one `filter = ` line — via `sized_filter_names` /
# `pinned_filter_names_for_class`. Its own guard, `the_sized_sweep_pin_
# names_exactly_the_batteries_marked_for_a_bounded_panel`, no longer needs
# to explain why an EMPTY roster is correct here — Task 9 gave this class
# its first member, `warren_readout.rs::the_blast_radius_readout`, the pole
# test this whole campaign measures against (465.7 s serial on the canonical
# box), then `raid_attribution_probe.rs::is_the_raid_proxy_ambiguous_or_is_
# its_population_stale` (268.2 s serial), then
# `tolerance_mutation.rs::zero_dispersion_collapses_between_settlement_
# variance` (254.7 s serial — its own conversion also inlined a helper
# function, `population`, into the test body, because the guard below
# recognises a `map_seeds` call only within the TEXTUAL SPAN of the heavy
# test that calls it, and `population` was defined earlier in the file,
# outside that span). All three proven byte-identical to their old serial
# selves via `HV_SEED_SWEEP_THREADS=1` (stdout diffed line for line on this
# Mac; the only differences were harness noise — a build timestamp,
# libtest's own ">60s" progress notice, and the run's own "finished in
# N.NNs" trailer — never test output).
#
# `threads-required = 30` — ONE SHARED WIDTH FOR EVERY MEMBER OF THIS CLASS,
# not a per-test setting (nextest overrides apply per TABLE, not per test
# name inside a filter). 30 is the WIDEST converted panel so far
# (`raid_attribution_probe.rs::SEEDS` and `tolerance_mutation.rs::SEEDS`,
# both `1..=30`); `warren_readout.rs`'s own panel is narrower (25). Each
# `map_seeds` caller's own `thread_budget` already clamps its actual
# OS-thread spawn to `min(available_parallelism, its own seed count)`, so a
# shared reservation wider than a narrower member's panel is never wrong,
# only slightly conservative for that member — the reservation is a nextest
# SCHEDULING budget, not a promise every member spawns exactly that many
# threads.
#
# NEITHER OF TASK 1's TWO PROPERTIES APPLIES TO THIS CLASS, DELIBERATELY.
# It is not in `MARKERS_ALLOWING_MULTIPLE_TABLES`: it does not need MULTIPLE
# override tables (one shared bounded width can serve every sized-sweep test
# the same way one `"num-cpus"` table already serves all three scatter-sweep
# batteries), and it does not need a `priority` setting — a bounded
# `threads-required` reservation does not drain the whole runner, so there is
# no barrier to front-load in the first place. See that const's own comment
# in `heavy_tier.rs` for why `front-loaded` needed both properties and this
# class needs neither.
[[profile.default.overrides]]
# class: sized-sweep
filter = 'test(/the_blast_radius_readout$/) | test(/is_the_raid_proxy_ambiguous_or_is_its_population_stale$/) | test(/zero_dispersion_collapses_between_settlement_variance$/) | test(/the_cascade_distribution_is_adjudicated$/)'
threads-required = 30

# UNUSED since The Sexton (Task 3): `make gate` (the only caller of the
# duration alarm now that `make ci` is an alias for it, see the Makefile's
# `gate-run`) deliberately runs the DEFAULT profile, not this one — running
# the gate under `fail-fast = false` would silently turn every red gate into
# a full-suite run, 368 times a month, on the exact axis this campaign exists
# to protect. Left in place as a hand-invocable profile
# (`cargo nextest run --profile ci`) and as the historical record of why
# `fail-fast = false` matters for a duration-collecting run — see
# `[profile.heavy]` below, which exists for the same reason on the tier that
# still needs it.
[profile.ci]
# Report a test that crosses this, but never terminate it.
slow-timeout = { period = "60s" }
# Full output for anything that fails, so the persisted log is self-contained.
failure-output = "immediate-final"
# Load-bearing FOR A HAND-RUN `--profile ci` invocation: the duration alarm
# needs a time for EVERY test, and a fail-fast run cancels the rest. The
# Siding lost a whole heavy-tier run to exactly this — 28 tests cancelled
# after one failure, with no durations for any of them. `make gate` no longer
# takes this path (see above); scoping this profile to nextest's default
# fail-fast would silently reintroduce that loss for anyone who runs it by
# hand for the reason it was written.
fail-fast = false

[profile.heavy]
# THE HEAVY TIER's execution profile — `scripts/gate-full-heavy.sh` passes
# `--profile heavy`. It exists for one setting, and the argument for that
# setting is already made above under `[profile.ci]`: a fail-fast run cancels
# the rest, and The Siding lost a whole heavy-tier run to exactly that.
#
# The Siding fixed `make ci`. The paths that actually RUN the heavy tier —
# `make gate-full` and `make heavy-remote` — inherited `[profile.default]`
# and kept paying. The 2026-08-05 run against 53fdd77b is the receipt: a
# deliberate assertion failure at 149 s cancelled the run, and the tier's
# last long battery was SIGTERM'd 14,143 s in without ever completing, then
# counted in the summary as a FAILURE when it had simply never been run.
#
# A SEPARATE PROFILE, not an edit to `[profile.default]`: that profile is
# shared with `make gate` and must keep behaving exactly as it did. A profile
# inherits from `default`, so everything else here is unchanged.
fail-fast = false
