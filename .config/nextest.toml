# .config/nextest.toml — the profile surface, unused until The Timekeeper.
#
# `default` is deliberately left at nextest's own defaults: `make gate` must
# behave exactly as it did before this campaign.
#
# `slow-timeout.period` MARKS a test slow; it does not kill it.
# `terminate-after` is deliberately absent (The Timekeeper spec, N4):
# observation and enforcement are separate knobs, and conflating them means a
# contention blip destroys a run instead of reporting one.

[profile.default]

[profile.ci]
# Report a test that crosses this, but never terminate it.
slow-timeout = { period = "60s" }
# Full output for anything that fails, so the persisted log is self-contained.
failure-output = "immediate-final"
# Load-bearing: the duration alarm needs a time for EVERY test, and a
# fail-fast run cancels the rest. The Siding lost a whole heavy-tier run to
# exactly this — 28 tests cancelled after one failure, with no durations for
# any of them.
fail-fast = false

[profile.heavy]
# THE HEAVY TIER's execution profile — `scripts/gate-full-heavy.sh` passes
# `--profile heavy`. It exists for one setting, and the argument for that
# setting is already made above under `[profile.ci]`: a fail-fast run cancels
# the rest, and The Siding lost a whole heavy-tier run to exactly that.
#
# The Siding fixed `make ci`. The paths that actually RUN the heavy tier —
# `make gate-full` and `make heavy-remote` — inherited `[profile.default]`
# and kept paying. The 2026-08-05 run against 53fdd77b is the receipt: a
# deliberate assertion failure at 149 s cancelled the run, and the tier's
# last long battery was SIGTERM'd 14,143 s in without ever completing, then
# counted in the summary as a FAILURE when it had simply never been run.
#
# A SEPARATE PROFILE, not an edit to `[profile.default]`: that profile is
# shared with `make gate` and must keep behaving exactly as it did. A profile
# inherits from `default`, so everything else here is unchanged.
fail-fast = false
