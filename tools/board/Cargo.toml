[package]
name = "board"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Empty table: this package is deliberately outside the main workspace
# (decision precedent 0027/0028, and tools/digest). An empty [workspace] here
# (not just the main Cargo.toml's `exclude`) stops cargo's ancestor search at
# this manifest unconditionally — without it, a checkout nested under another
# Cargo workspace (e.g. a worktree under `.claude/worktrees/`) makes cargo walk
# past this package's own workspace root and bind to the outer one.
[workspace]

[lib]
name = "board"
path = "src/lib.rs"

[[bin]]
name = "board"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
