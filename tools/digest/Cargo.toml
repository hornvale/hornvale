[package]
name = "digest"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# This local workspace keeps the package deliberately outside the simulation
# workspace (spec §4.6; precedent decisions 0027/0028). The explicit workspace
# root stops Cargo's ancestor search here while allowing enrolled outboard
# packages to live under `packages/*`.
[workspace]
members = ["packages/*"]
resolver = "3"

[lib]
name = "digest"
path = "src/lib.rs"

[[bin]]
name = "digest"
path = "src/main.rs"

[dependencies]
digest-protocol = { path = "packages/protocol" }
hornvale-kernel = { path = "../../kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
