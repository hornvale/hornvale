[package]
name = "sluice"
version = "0.1.0"
edition = "2024"

# Empty table: this package is deliberately outside the main workspace, the
# same way every other tools/* crate is (decision 0027). An empty [workspace]
# here (not just the main Cargo.toml's `exclude`) stops cargo's ancestor
# search at this manifest unconditionally — without it, a checkout nested
# under another Cargo workspace (e.g. a worktree under `.claude/worktrees/`
# inside the main repo tree, which is exactly where this crate was written)
# makes cargo walk past this package's own workspace root and mistakenly bind
# to the outer one.
[workspace]

