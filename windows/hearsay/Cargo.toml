[package]
name = "hornvale-hearsay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hornvale hearsay window: derive held claims from committed history."

[dependencies]
hornvale-kernel = { path = "../../kernel" }
hornvale-history = { path = "../../domains/history" }
# The precision ladder (Task 2b) reads this world's own cycles — fact
# predicates and `StdDays` — from committed sky facts. That is presentation,
# not composition, so it belongs in `[dependencies]` beside history rather
# than dev-only: `cli/tests/architecture.rs` permits a window depending on a
# domain.
hornvale-astronomy = { path = "../../domains/astronomy" }

# Task 6's heavy battery builds a real world. These are DEV-only on purpose:
# the library reads a ledger and nothing else, and a read-only window must not
# depend on the composition root at runtime.
[dev-dependencies]
hornvale-worldgen = { path = "../worldgen" }
hornvale-terrain = { path = "../../domains/terrain" }
# DEV-only — a read-only window must not depend on the composition root or on
# species data at runtime. Needed by three test targets, none of them the
# library: `probe_teller_relations.rs` (promoted, The Palimpsest Task 9 —
# reads allometric generation length to test whether a people-varying
# duration is commensurate with the ladder), and the readout batteries
# `palimpsest_readout.rs` / `palimpsest_readout_units.rs`, which read the
# same allometric data to compute the shipped rule. If the design ships, the
# runtime path goes through worldgen's `descent::generation_length_of`
# rather than this.
hornvale-species = { path = "../../domains/species" }
